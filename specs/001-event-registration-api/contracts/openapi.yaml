openapi: 3.0.3
info:
  title: Event Registration API
  version: 1.0.0
  description: API contract for event lifecycle and attendee registration management.
servers:
  - url: http://localhost:3000
tags:
  - name: Events
  - name: Registrations
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                required: [status, timestamp]
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events:
    get:
      tags: [Events]
      summary: List events
      responses:
        "200":
          description: Events returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                required: [data]
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
                required: [data]
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get event by id
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
                required: [data]
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Events]
      summary: Update event
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
                required: [data]
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Events]
      summary: Delete event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "204":
          description: Event deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventId}/registrations:
    post:
      tags: [Registrations]
      summary: Register attendee for event
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Registration"
                required: [data]
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventId}/registrations/{attendeeRef}:
    delete:
      tags: [Registrations]
      summary: Unregister attendee from event
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: attendeeRef
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "204":
          description: Registration removed
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        maxCapacity:
          type: integer
          minimum: 1
        currentRegistrations:
          type: integer
          minimum: 0
      required: [id, title, description, eventDate, maxCapacity, currentRegistrations]
    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        attendeeRef:
          type: string
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
      required: [id, eventId, attendeeRef, status]
    CreateEventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        eventDate:
          type: string
          format: date-time
        maxCapacity:
          type: integer
          minimum: 1
      required: [title, description, eventDate, maxCapacity]
    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        eventDate:
          type: string
          format: date-time
        maxCapacity:
          type: integer
          minimum: 1
      minProperties: 1
    RegisterRequest:
      type: object
      properties:
        attendeeRef:
          type: string
          minLength: 1
      required: [attendeeRef]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required: [code, message]
      required: [error]
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConflictError:
      description: Business-rule or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request payload exceeded configured limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
